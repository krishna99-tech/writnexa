version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quorix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-quorix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quorix_dev_secret}
      POSTGRES_DB: ${DB_NAME:-quorix_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quorix} -d ${DB_NAME:-quorix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quorix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: quorix-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Local SMTP port
      - "8025:8025" # Web UI to view captured transactional emails
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: quorix-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quorix}
      DB_PASSWORD: ${DB_PASSWORD:-quorix_dev_secret}
      DB_NAME: ${DB_NAME:-quorix_db}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full-stack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quorix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    profiles:
      - full-stack

volumes:
  postgres_data:
  redis_data:
